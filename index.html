<script>
// 大廳：回傳 { on:false }（單人）或 { on:true, ws, init, ... }（已連上房間並收到世界資料）
window.netBoot = () => new Promise(res => {
  const $ = id => document.getElementById(id), L = $('lobby'), qp = new URLSearchParams(location.search);
  const ls = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  $('nameIn').value = ls('mc_name'); $('roomIn').value = qp.get('room') || ls('mc_room');
  if (!/^https?:$/.test(location.protocol)) { $('btnMulti').disabled = true; $('lobbyMsg').textContent = '用檔案開啟只能單人遊玩；部署到網站後即可多人連線'; }
  $('btnSolo').onclick = () => { L.style.display = 'none'; res({ on: false }); };
  $('btnMulti').onclick = () => {
    const name = $('nameIn').value.trim() || '玩家' + (100 + Math.random() * 900 | 0), room = $('roomIn').value.trim() || 'lobby';
    try { localStorage.setItem('mc_name', name); localStorage.setItem('mc_room', room); } catch (e) {}
    $('lobbyMsg').textContent = '連線中…'; $('btnMulti').disabled = true;
    const NET = { on: true, room, name, queue: [], out: [], handle: null, init: null, id: null, host: false, off: 0, acc: 0, bacc: 0, last: '' };
    const fail = m => { $('lobbyMsg').textContent = m; $('btnMulti').disabled = false; };
    let ws; try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + encodeURIComponent(room) + '&name=' + encodeURIComponent(name), ['mc']); } catch (e) { fail('無法連線到伺服器'); return; }
    NET.ws = ws;
    ws.onerror = () => fail('無法連線到伺服器');
    ws.onclose = () => { if (!NET.init && !NET.denied) fail('連線被關閉（房間可能已滿）'); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'deny' && !NET.init) { NET.denied = true; fail(m.reason); return; }
      if (!NET.init && m.t === 'init') { NET.init = m; NET.skip = m.skip || 0; NET.id = m.id; NET.host = m.host === m.id; NET.off = m.now - Date.now(); L.style.display = 'none'; res(NET); }
      else if (NET.handle) NET.handle(m); else NET.queue.push(m);
    };
  };
});
</script>

{ const p = [...Array(256).keys()];

}

    g.gain.setValueAtTime(vol, t + dl); g.gain.exponentialRampToValueAtTime(0.001, t + dl + dur); s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t + dl, Math.random()); s.stop(t + dl + dur);
  };

    case 'place': tone('sine', 240, 110, 0.09, 0.3); noise(0.05, 0.12, 900); break;
    case 'step': noise(0.06, 0.1, 500 + Math.random() * 300); break;

    case 'eat': for (let i = 0; i < 3; i++) noise(0.07, 0.25, 1800, i * 0.12); break;

  const arms = [limb(skin, -.36, 1.38), limb(skin, .36, 1.38)], legs = [limb(pants, -.13, .7), limb(pants, .13, .7)];
  const tag = tagSprite(p.name); tag.position.y = 2.1; g.add(tag);
  g.position.set(p.x, p.y, p.z); scene.add(g);
  PLAYERS.set(p.id, { g, head, arms, legs, tx: p.x, ty: p.y, tz: p.z, yaw: p.yaw || 0, pitch: p.pitch || 0, ph: 0, name: p.name });
}
function updatePlayers(dt) {                                 // 位置平滑插值 + 走路擺動
  const k = Math.min(1, dt * 12);
  for (const p of PLAYERS.values()) {
    const g = p.g, ox = g.position.x, oz = g.position.z;
    g.position.x += (p.tx - ox) * k; g.position.y += (p.ty - g.position.y) * k; g.position.z += (p.tz - oz) * k;
    const sp = dt > 0 ? Math.hypot(g.position.x - ox, g.position.z - oz) / dt : 0, sw = Math.min(1, sp / 2.5) * 0.8;
    p.ph += dt * Math.min(sp, 6) * 2.2;
    p.legs[0].rotation.x = Math.sin(p.ph) * sw; p.legs[1].rotation.x = -Math.sin(p.ph) * sw;
    p.arms[0].rotation.x = -Math.sin(p.ph) * sw; p.arms[1].rotation.x = Math.sin(p.ph) * sw;
    g.rotation.y = p.yaw + Math.PI; p.head.rotation.x = -p.pitch;
  }
}
function applyEdits(list) {                                  // 套用別人的方塊變更（區塊未載入就先記進存檔表）
  netApplying = true;
  for (const [x, y, z, v] of list) {
    const b = v & 63, k = kk(x, y, z);
    if (chunkAt(x >> 4, z >> 4)) setRaw(x, y, z, b); else editAt(x, y, z, b);
    if (b && (v & 64)) placed.add(k);
  }
  netApplying = false; processSupport(); flush();
}
function netHandle(m) {
  if (m.t === 'pos') { const p = PLAYERS.get(m.id); if (p) { p.tx = m.x; p.ty = m.y; p.tz = m.z; p.yaw = m.yaw; p.pitch = m.pitch; } }
  else if (m.t === 'blk') applyEdits(m.e);
  else if (m.t === 'chat') chatLog(m.name, m.m);
  else if (m.t === 'join') { addPlayer({ id: m.id, name: m.name, x: 8.5, y: 80, z: 8.5 }); chatLog('', m.name + ' 加入了遊戲'); }
  else if (m.t === 'leave') { const p = PLAYERS.get(m.id); if (p) { chatLog('', p.name + ' 離開了遊戲'); scene.remove(p.g); PLAYERS.delete(m.id); } }
  else if (m.t === 'host') NET.host = m.id === NET.id;
  else if (m.t === 'sys') chatLog('', m.m);
  else if (m.t === 'deny') { toast(m.reason); chatLog('', m.reason); setTimeout(() => location.reload(), 3000); }   // 被踢出 / 在別處登入 / 異常操作
  else if (m.t === 'rubber') { P.x = m.x; P.y = m.y; P.z = m.z; vy = 0; toast('位置已由伺服器校正'); }               // 反作弊：拉回上一個合法位置
  else if (m.t === 'sleepers') toast(m.n + '/' + m.need + ' 位玩家在睡覺');
  else if (m.t === 'skip') { NET.off += m.skip - (NET.skip || 0); NET.skip = m.skip; const f = $('fade'); f.style.opacity = 1; setTimeout(() => { f.style.opacity = 0; }, 700); toast('天亮了'); }   // 過半數玩家睡覺 → 伺服器快轉到清晨
}
function netRespawn() { if (NET.on && NET.ws && NET.ws.readyState === 1) NET.ws.send('{"t":"respawn"}'); }   // 告知伺服器：接下來的瞬移是重生，不是作弊
function netStep(dt) {                                       // 每 0.1 秒送位置、每 0.25 秒送方塊變更
  if (!NET.on || !NET.ws || NET.ws.readyState !== 1) return;
  if ((NET.acc += dt) >= 0.1) {
    NET.acc = 0; const r = v => Math.round(v * 100) / 100, k = [P.x, P.y, P.z, yaw, pitch].map(r).join();
    if (k !== NET.last) { NET.last = k; NET.ws.send(JSON.stringify({ t: 'pos', x: r(P.x), y: r(P.y), z: r(P.z), yaw: r(yaw), pitch: r(pitch) })); }
  }
  if ((NET.bacc += dt) >= 0.25 && NET.out.length) {
    NET.bacc = 0;
    while (NET.out.length) NET.ws.send(JSON.stringify({ t: 'blk', e: NET.out.splice(0, 150).map(([x, y, z, t, old]) => [x, y, z, t | (t && placed.has(kk(x, y, z)) ? 64 : 0), old]) }));
  }
}

/* ================= 設定選單與存檔 ================= */
const SENS = [0.6, 1, 1.6];
function look(dx, dy, k) {
  yaw -= dx * k * SENS[ST.sens];
  pitch = Math.max(-1.55, Math.min(1.55, pitch - dy * k * SENS[ST.sens] * (ST.inv ? -1 : 1)));
}
let noSave = NET.on, lastSave = performance.now();
function saveGame() {
  if (noSave) return false;
  try {
    const ed = {}; for (const [k, e] of EDITS) ed[k] = e;
    localStorage.setItem('mc_save', JSON.stringify({ v: 1, seed: SEED0, hs: HS, p: { x: P.x, y: P.y, z: P.z }, yaw, pitch, rain, sel, inv: INV, tod, day, hp, food, qi, dur: DUR, stat: STAT,
      edits: ed, placed: [...placed], water: [...WL.values()].filter(w => w.l === 8).map(w => [w.x, w.y, w.z]) }));
    return true;
  } catch (e) { return false; }                          // 容量不足時回報失敗
}
function applyST() { document.body.classList.toggle('left', !!ST.left); try { localStorage.setItem('mc_set', JSON.stringify(ST)); } catch (e) {} }
const menuEl = $('menu');
[['畫質', 'q', ['低', '中', '高'], 1], ['視角靈敏度', 'sens', ['低', '中', '高']], ['反轉 Y 軸', 'inv', ['關', '開']],
 ['遊戲模式', 'mode', ['生存', '創造']], ['音效', 'snd', ['開', '關']], ['左手模式', 'left', ['關', '開']], ['除錯資訊', 'dbg', ['關', '開']]].forEach(([name, key, opts, reload]) => {
  const b = document.createElement('button'), show = () => { b.textContent = name + '：' + opts[ST[key]]; };
  b.onclick = () => { ST[key] = (ST[key] + 1) % opts.length; show(); applyST(); drawHotbar(); if (reload) { saveGame(); location.reload(); } };   // 畫質需重新載入
  show(); menuEl.appendChild(b);
});
const saveBtn = document.createElement('button'); saveBtn.textContent = '立即存檔';
saveBtn.onclick = () => { saveBtn.textContent = saveGame() ? '已存檔 ✓' : '存檔失敗'; setTimeout(() => saveBtn.textContent = '立即存檔', 1500); };
const newBtn = document.createElement('button'); newBtn.textContent = '新世界';
newBtn.onclick = () => { if (confirm('刪除存檔並建立新世界？')) { noSave = true; localStorage.removeItem('mc_save'); location.reload(); } };
menuEl.append(saveBtn, newBtn);
const resume = () => { startEl.style.display = 'none'; if (touchMode) running = true; else canvas.requestPointerLock(); };
const craftBtn = document.createElement('button'); craftBtn.textContent = '🔨 合成';
craftBtn.onclick = () => { if (ST.mode) { resume(); toast('創造模式不需要合成'); } else { startEl.style.display = 'none'; openCraft(true); } };
const eatBtn = document.createElement('button'); eatBtn.textContent = '🍖 進食'; eatBtn.onclick = () => { resume(); eat(); };
menuEl.prepend(craftBtn, eatBtn);
if (NET.on) {
  const chatBtn = document.createElement('button'); chatBtn.textContent = '💬 聊天';
  chatBtn.onclick = () => { startEl.style.display = 'none'; if (touchMode) { resume(); sendChat(prompt('輸入訊息')); } else openChat(true); };
  const linkBtn = document.createElement('button'); linkBtn.textContent = '🔗 複製邀請連結';
  linkBtn.onclick = () => { const u = location.origin + location.pathname + '?room=' + encodeURIComponent(NET.room); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('已複製邀請連結'), () => prompt('複製這個連結給朋友', u)); };
  menuEl.prepend(chatBtn, linkBtn);
}
menuEl.addEventListener('click', e => e.stopPropagation());   // 點選項不要當成「開始遊戲」
$('bP').addEventListener('pointerdown', e => { e.preventDefault(); running = false; startEl.style.display = 'flex'; });
addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
applyST();

/* ================= 射線與方塊互動 ================= */
const dirV = new THREE.Vector3();
function raycast(maxD = 6) {
  camera.getWorldDirection(dirV);
  const ox = P.x, oy = P.y + EYE, oz = P.z, dx = dirV.x, dy = dirV.y, dz = dirV.z;
  let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
  const sx = Math.sign(dx), sy = Math.sign(dy), sz = Math.sign(dz);
  const tdx = dx ? Math.abs(1 / dx) : Infinity, tdy = dy ? Math.abs(1 / dy) : Infinity, tdz = dz ? Math.abs(1 / dz) : Infinity;
  let tx = dx > 0 ? (x + 1 - ox) / dx : dx < 0 ? (ox - x) / -dx : Infinity;
  let ty = dy > 0 ? (y + 1 - oy) / dy : dy < 0 ? (oy - y) / -dy : Infinity;
  let tz = dz > 0 ? (z + 1 - oz) / dz : dz < 0 ? (oz - z) / -dz : Infinity;
  let nx = 0, ny = 0, nz = 0, t = 0;
  while (t <= maxD) {
    if (get(x, y, z)) return { x, y, z, nx, ny, nz };
    if (tx < ty && tx < tz) { x += sx; t = tx; tx += tdx; nx = -sx; ny = 0; nz = 0; }
    else if (ty < tz)       { y += sy; t = ty; ty += tdy; nx = 0; ny = -sy; nz = 0; }
    else                    { z += sz; t = tz; tz += tdz; nx = 0; ny = 0; nz = -sz; }
  }
  return null;
}
function act(place) {
  if (!place && hitMob()) return;                            // 先判定是否打到怪物
  const h = raycast(); if (!h) return;
  if (place && get(h.x, h.y, h.z) === 19) { sleep(h); return; }   // 對床右鍵/放置模式點擊 = 睡覺
  if (!place) {
    if (h.y <= 0) return;
    const t = get(h.x, h.y, h.z), tier = bestPick();   // t = 被挖的方塊
    if (!ST.mode && (NEED[t] || 0) > tier) { toast('需要更好的鎬子'); return; }
    if (!ST.mode && NEED[t]) useTool(tier);                  // 挖石頭/礦物消耗鎬子耐久
    setBlock(h.x, h.y, h.z, 0); sfx('break');
    if (t === 9) addItem(9);
    if (t === 6 && Math.random() < 0.15) addItem(27);        // 樹葉偶爾掉蘋果
    burst(h.x + .5, h.y + .5, h.z + .5, t, 16, 3.2);          // 碎成一粒一粒的顆粒
    if (t === 1 && Math.random() < 0.12) addItem(42);        // 割草偶爾得到小麥種子
    if (t === 43 && Math.random() < 0.6) addItem(42);        // 收成小麥也可能留種
    const d = t in DROP ? DROP[t] : t;                       // 破壞後得到的東西（0 = 沒有）
    for (let n = 0; n < (DROPN[t] || 1); n++) { if (d && COL[d]) spawnDebris(h.x + .5, h.y + .5, h.z + .5, d, 2); else if (d) addItem(d); }
    return;
  }
  const px = h.x + h.nx, py = h.y + h.ny, pz = h.z + h.nz;
  if (py < 0 || py >= H || get(px, py, pz)) return;
  const bt = BLOCKS[sel];
  if (!ST.mode && !(INV[bt] > 0)) return;                    // 生存模式：沒有這種方塊就不能放
  if (bt === 42 && ![1, 2].includes(get(px, py - 1, pz))) { toast('小麥只能種在草地或泥土上'); return; }
  setBlock(px, py, pz, bt);
  if (boxHit(P.x, P.y, P.z)) { setBlock(px, py, pz, 0); return; }
  if (bt !== 9 && bt !== 10) placed.add(kk(px, py, pz));     // 記為玩家建築（承重判定）
  if (!ST.mode) { INV[bt]--; drawHotbar(); }
  sfx('place'); burst(px + .5, py + .5, pz + .5, bt, 5, 1.6); if (GRAN[bt]) gq.push([px, py, pz]);      // 不能把方塊放進自己身體裡
}

/* ================= 啟動與主迴圈 ================= */
if (NET.on) {                                              // 多人：還原伺服器上的方塊修改、其他玩家，開始接收訊息
  for (const [x, y, z, v] of NET.init.edits) { editAt(x, y, z, v & 63); if (v & 64) placed.add(kk(x, y, z)); }
  NET.init.players.forEach(addPlayer);
  NET.handle = netHandle; NET.queue.forEach(netHandle); NET.queue.length = 0;
  NET.ws.onmessage = e => netHandle(JSON.parse(e.data));
  NET.ws.onclose = () => { toast('與伺服器的連線中斷，請重新整理頁面'); chatLog('', '連線中斷，請重新整理頁面'); };
  chatLog('', '已加入房間「' + NET.room + '」，按 Enter 聊天');
}
if (SAVE) {                                               // 還原玩家、天氣、建築與水源
  Object.assign(P, SAVE.p); yaw = SAVE.yaw; pitch = SAVE.pitch; select(SAVE.sel || 0);
  if (SAVE.rain) setRain(true);
  for (const k of SAVE.placed || []) placed.add(k);
  for (const [x, y, z] of SAVE.water || []) editAt(x, y, z, 9);
}
stream(3);                                                  // 先同步載入出生點附近
if (!SAVE) { let sy = H - 1; while (sy > 0 && !get(10, sy, 8)) sy--; P.y = sy + 1; }
const spawn = { x: P.x, y: P.y, z: P.z };

let last = performance.now(), frame = 0, fps = 60;
const info = $('info');
function loop(now) {
  requestAnimationFrame(loop);
  const rawDt = (now - last) / 1000; last = now;
  const dt = Math.min(0.05, rawDt);
  fps += (1 / Math.max(rawDt, 0.001) - fps) * 0.05;

  skyStep(running ? dt : 0); netStep(dt); updatePlayers(dt); torchStep(now); audioStep(dt); if (running) stepMobs(dt); hurtT = Math.max(0, hurtT - dt);

  if ((simT += dt) >= SIM_DT) { simT = 0; simTick(); }
  if (running && !(touchMode && innerHeight > innerWidth)) {   // 手機直向時暫停
    let fz = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0) + mv.f - mv.b;

  }

  camera.rotation.set(pitch, yaw, 0);
  const h = running ? raycast() : null;
  outline.visible = !!h;
  if (h) outline.position.set(h.x + .5, h.y + .5, h.z + .5);
  if (frame % 10 === 0) hud();
  if (frame % 10 === 0) info.textContent = !ST.dbg ? '' : 'X ' + (P.x | 0) + '  Y ' + (P.y | 0) + '  Z ' + (P.z | 0) + '  ·  ' + Math.round(fps) + ' fps';
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
})();
